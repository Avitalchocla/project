name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🐍 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: ⚙️ Install deps
      run: |
        sudo apt update
        sudo apt install -y zip unzip openjdk-17-jdk python3-pip git
        pip install --upgrade pip
        pip install buildozer cython

    - name: 📁 Prepare folders
      run: mkdir -p assets

    - name: 📥 Download FFmpeg
      run: |
        wget https://files.catbox.moe/g2umsq -O assets/ffmpeg
        chmod +x assets/ffmpeg

    # 👇 זה התיקון החשוב
    - name: 🔧 Fix Android SDK + NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-30" "build-tools;30.0.3" "ndk;25.2.9519653"

    - name: 🔨 Build APK
      run: |
        buildozer android debug

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ezedit-apk
        path: bin/*.apk
