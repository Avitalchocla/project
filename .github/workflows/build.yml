name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 📥 הורדת הקוד
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 🐍 Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ☕ Java 17 (חובה!)
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔍 בדיקה ש-Java נכון
      - name: ✅ Check Java
        run: |
          java -version
          echo $JAVA_HOME

      # 🤖 Android SDK
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      # ⚙️ התקנת SDK + Build Tools (מתקן AIDL!)
      - name: ⚙️ Install Android tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      # 📦 התקנות מערכת
      - name: 📦 Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip git python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5 libncursesw5 cmake libffi-dev libssl-dev build-essential wget
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      # 🎬 הורדת FFmpeg לתוך assets
      - name: 🎬 Download FFmpeg
        run: |
          mkdir -p assets
          wget https://files.catbox.moe/g2umsq -O assets/ffmpeg
          chmod +x assets/ffmpeg

      # 🧹 ניקוי
      - name: 🧹 Clean previous builds
        run: |
          buildozer android clean

      # 🏗️ בניית APK
      - name: 🏗️ Build APK
        run: |
          buildozer -v android debug

      # 📤 העלאת הקובץ
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ezedit-apk
          path: bin/*.apk
