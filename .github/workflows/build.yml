name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5 cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.33

      # 👇 הורדת FFmpeg שלך
      - name: Download FFmpeg
        run: |
          wget https://files.catbox.moe/g2umsq -O ffmpeg
          chmod +x ffmpeg

      - name: Check FFmpeg
        run: |
          file ffmpeg

      - name: Build
        run: |
          yes | sdkmanager --licenses || true
          buildozer android debug

      - name: Rename APK
        run: |
          APK=$(ls bin/*.apk | head -n 1)
          cp "$APK" bin/ezedit-3.5-arm64-v8a-debug.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ezedit-apk
          path: bin/ezedit-3.5-arm64-v8a-debug.apk
