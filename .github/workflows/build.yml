name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04   # חשוב! יותר יציב מ-24.04

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'   # ✅ תיקון

    - name: ⚙️ Install system deps
      run: |
        sudo apt update
        sudo apt install -y zip unzip openjdk-17-jdk python3-pip git
        pip install --upgrade pip
        pip install buildozer cython

    - name: 📁 Prepare folders
      run: |
        mkdir -p assets

    - name: 📥 Download FFmpeg
      run: |
        wget https://files.catbox.moe/g2umsq -O assets/ffmpeg
        chmod +x assets/ffmpeg
        ls -la assets/

    - name: 🔨 Build APK
      run: |
        buildozer android debug

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ezedit-apk
        path: bin/*.apk
